<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Image Gallery</h1>
  <nav id="filters" aria-label="Filter images">
    <button class="active" data-filter="all">All</button>
    <button data-filter="nature">Nature</button>
    <button data-filter="city">City</button>
    <button data-filter="animals">Animals</button>
  </nav>
</header>
<main id="gallery" class="gallery"></main>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-btn close" aria-label="Close">&times;</button>
  <button class="lb-btn prev" aria-label="Previous">&#8249;</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-btn next" aria-label="Next">&#8250;</button>
</div>
<script src="script.js"></script>
</body>
</html>
